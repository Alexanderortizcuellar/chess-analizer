[package]
name = "chess-analizer"
version = "0.1.0"
edition = "2024"
default-run = "chess-analizer"

[dependencies]
shakmaty = "0.30"
pgn-reader = "0.29"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
sysinfo = "0.30"
